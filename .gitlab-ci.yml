    ENV_STAGE: stage
    PROJECT_CLIENT: insinkerator_eu
  script:
    - cd playwright
    - yarn install
    - npx playwright install chrome
    - echo "Running Playwright tests..."
    # staging.insinkerator-eu.work doesn't reliably handle concurrent
    # Chrome sessions (confirmed 2026-08-07: 14/32 failures at the
    # default worker count, 1/32 running serially) - --workers 1
    # overrides playwright.config.ts's own project-scoped cap, which
    # would otherwise be masked by this job's --workers 3.
    - PROJECT=$PROJECT_CLIENT ENV=$ENV_STAGE npx playwright test --workers 1 --project=$PROJECT
  artifacts:
    paths:
      - playwright/projects/$PROJECT_CLIENT/html-report/
      - slack-payload-$PROJECT_CLIENT.json
    when: always
    expire_in: 5 days
  rules:
    - if: $UPSTREAM_PROJECT_NAME == "insinkerator_eu"
    - when: manual

# --- Slack notifications ---------

.slack-notify:
  stage: .post
  image: curlimages/curl:latest
  variables:
    GIT_STRATEGY: none # no checkout needed for a curl
  cache: {} # do not restore playwright/node_modules here
  script:
    - '[ -n "$WEBHOOK" ] || { echo "No Slack webhook configured for this project (set SLACK_WEBHOOK_<PROJECT> as a masked CI variable)"; exit 1; }'
    - '[ -f "$PAYLOAD" ] || { echo "$PAYLOAD missing — the test job did not run, nothing to notify"; exit 0; }'
    - >
      curl -sS -X POST -H 'Content-Type: application/json' -w '\nHTTP %{http_code}\n'
      "$WEBHOOK" --data @"$PAYLOAD"

notify:kooltech:
  extends: .slack-notify
  needs:
    - job: e2e_tests_kooltech_stage
      artifacts: true
  variables:
    PAYLOAD: slack-payload-kooltech.json
    WEBHOOK: $SLACK_WEBHOOK_KOOLTECH

