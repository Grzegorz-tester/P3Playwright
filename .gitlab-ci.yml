include:
  - project: 9xb/peracto/ci-templates
    file: parrot/base.gitlab-ci.yml

image: mcr.microsoft.com/playwright:latest
variables:
  AWS_CLI_URL: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
  STAGING_SG: sg-01d37b45465f45c05
  STAGING_SUBNET: subnet-0b557486a15111887

cache:
  paths:
    - playwright/node_modules/

.e2e_tests:
  stage: test
  image: mcr.microsoft.com/playwright:latest #official playwright image
  parallel: #parallelism increase the values if required
    matrix:
      - PROJECT: [ 'Chrome' ]
        SHARD_INDEX: [ 2 ]
        SHARD_TOTAL: 1
  timeout: 20 hours 30 minutes #overriding the default gitlab runner timeout optional
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: true

e2e_tests_kooltech_stage:
  extends: .e2e_tests
  #needs:
  #  - deploy-staging
  variables:
    ENV_STAGE: stage
    PROJECT_CLIENT: kooltech
  script:
    - cd playwright
    - yarn install
    - npx playwright install chrome
    - echo "Running Playwright tests..."
    - PROJECT=$PROJECT_CLIENT ENV=$ENV_STAGE npx playwright test --workers 3 --project=$PROJECT
  artifacts:
    paths:
      - playwright/$PROJECT_CLIENT/html-report/
    when: always
    expire_in: 5 days
  rules:
    - if: $UPSTREAM_PROJECT_NAME == "kooltech"
      
e2e_tests_keylite_stage:
  extends: .e2e_tests
  #needs:
  #  - deploy-staging
  variables:
    ENV_STAGE: stage
    PROJECT_CLIENT: keylite
  script:
    - cd playwright
    - yarn install
    - npx playwright install chrome
    - echo "Running Playwright tests..."
    - PROJECT=$PROJECT_CLIENT ENV=$ENV_STAGE npx playwright test --workers 3 --project=$PROJECT
  artifacts:
    paths:
      - playwright/$PROJECT_CLIENT/html-report/
    when: always
    expire_in: 5 days
  rules:
    - if: $UPSTREAM_PROJECT_NAME == "keylite"


